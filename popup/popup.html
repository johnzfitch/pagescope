<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0060df;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #003eaa;
    }
  </style>
</head>
<body>
  <button id="open-sidebar">Open Inspector</button>
  <script>
    document.getElementById('open-sidebar').addEventListener('click', () => {
      browser.sidebarAction.open();
      window.close();
    });
  </script>
</body>
</html>
